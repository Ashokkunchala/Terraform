name: terraform-quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  CHECKOV_SKIP_DOWNLOAD: "true"

jobs:
  format:
    name: Terraform formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Format check
        run: terraform fmt -check -recursive

  validate:
    name: Validate Terraform roots
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        working-directory:
          - labs/00-local-basics
          - labs/01-s3-static-data
          - projects/00-state-bootstrap
          - projects/01-static-site
          - projects/02-ecs-platform
          - projects/03-eks-platform
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Initialize without backend
        working-directory: ${{ matrix.working-directory }}
        run: terraform init -backend=false -input=false -no-color
      - name: Validate
        working-directory: ${{ matrix.working-directory }}
        run: terraform validate -no-color
      - name: Test local lab
        if: matrix.working-directory == 'labs/00-local-basics'
        working-directory: labs/00-local-basics
        run: terraform test -no-color

  security:
    name: IaC security scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Checkov
        run: python -m pip install --disable-pip-version-check "checkov>=3,<4"
      - name: Scan Terraform and Kubernetes manifests
        run: checkov --directory . --framework terraform kubernetes --quiet --soft-fail
